<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4042" />
    <meta name="robots" content="noindex" />
    <title>Sayfa Bulunamadı | Baget Burger Milas</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #1d4042; color: #f5ead7; font-family: Arial, sans-serif; }
      main { width: min(680px, 100%); text-align: center; }
      .code { margin: 0; color: #f2a42b; font-size: clamp(5rem, 24vw, 11rem); font-weight: 900; line-height: .8; letter-spacing: -.08em; }
      h1 { margin: 32px 0 12px; font-size: clamp(1.8rem, 6vw, 3.2rem); }
      p { margin: 0 auto; max-width: 470px; color: rgba(245, 234, 215, .76); line-height: 1.6; }
      a { min-height: 52px; margin-top: 34px; padding: 0 25px; display: inline-flex; align-items: center; justify-content: center; background: #f2a42b; color: #183d3f; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f5ead7; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>BU SAYFA MENÜDE YOK.</h1>
      <p>Aradığın sayfa bulunamadı. Ana sayfaya dönerek Baget Burger menüsünü inceleyebilirsin.</p>
      <a href="/">ANA SAYFAYA DÖN</a>
    </main>
  </body>
</html>
